<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Outlet Park Rzeszów 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Sans:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: the model fills the screen; dark-glass instruments float over it like a presentation HUD:
   identity top-left, area schedule top-right, a centred control dock at the bottom, light & season dial bottom-right.
   Deliberately single-theme (dark glass over a bright 3D scene). */
:root{
  --ink:#0d1113;
  --glass:rgba(15,19,21,.74);
  --glass-hi:rgba(255,255,255,.07);
  --hair:rgba(255,255,255,.11);
  --text:#f2f0eb;
  --muted:#a6aca9;
  --brass:#d7a65e;
  --brass-soft:rgba(215,166,94,.16);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --shadow:0 18px 50px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25);
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
button{font:inherit;color:inherit}

/* loader */
.loader{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 40%,#1b2226 0%,#0b0e10 70%);display:grid;place-items:center;transition:opacity .9s ease,visibility .9s}
.loader .in{display:grid;justify-items:center;gap:14px;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.loader .mono{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:var(--brass);color:#1a1408;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:20px;letter-spacing:.02em}
.loader h2{margin:6px 0 0;font-family:var(--display);font-stretch:115%;font-weight:700;font-size:clamp(24px,4vw,40px);letter-spacing:.06em;text-transform:uppercase}
.loader p{margin:0;color:var(--muted);font-size:14px;letter-spacing:.04em}
.loader .bar{width:220px;height:2px;background:var(--hair);overflow:hidden;border-radius:2px;margin-top:10px}
.loader .bar i{display:block;height:100%;width:40%;background:var(--brass);animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
body.ready .loader{opacity:0;visibility:hidden}

/* 3D labels (CSS2DRenderer positions them; `translate` lifts them above their anchor) */
.lbl{position:relative;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;translate:0 -20px;
  background:rgba(13,17,19,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--text);
  padding:4px 11px 4px 4px;border-radius:999px;border:1px solid var(--hair);white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.28);transition:background .2s,border-color .2s}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:16px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0))}
.lbl b{display:flex;align-items:center;font-family:var(--display);font-stretch:108%;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.lbl b i{font-style:normal;display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--c,var(--brass));color:#101315;font-weight:700;font-size:11px;margin-right:8px;letter-spacing:0}
.lbl span{display:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:28px;line-height:1.2;margin-top:2px}
.lbl:hover span,.lbl.active span{display:block}
.lbl:hover,.lbl.active{border-color:var(--brass);background:rgba(28,24,17,.88)}
.lbl.minor{padding:3px 9px 3px 3px;opacity:.92}
.lbl.minor b{font-size:10px}
.lbl.minor b i{min-width:18px;height:18px;font-size:10px;margin-right:6px}
.lbl.minor span{margin-left:24px;font-size:10.5px}
.lbl.minor:not(:has(i)){padding:4px 10px}
.lbl.minor:not(:has(i)) b{color:var(--c,var(--text))}
.lbl.road{cursor:default;padding:5px 12px;background:rgba(150,26,30,.88);border-color:rgba(255,255,255,.25)}
.lbl.road::after{display:none}
.lbl.road:hover{background:rgba(150,26,30,.88);border-color:rgba(255,255,255,.25)}
.hide-labels .lbl{display:none}

/* glass panels */
.panel{position:absolute;background:var(--glass);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);transition:opacity .5s,transform .5s}
.eyebrow{font-family:var(--display);font-stretch:110%;font-weight:600;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}

.brand{top:calc(18px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;padding:14px 20px 14px 14px;max-width:calc(100% - 36px)}
.brand .mono{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:var(--brass);color:#1a1408;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:16px}
.brand h1{margin:3px 0 2px;font-family:var(--display);font-stretch:115%;font-weight:700;font-size:23px;line-height:1;letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.brand .tag{margin:0;color:var(--muted);font-size:12px;letter-spacing:.06em}
.brand>div{min-width:0}

.side{top:calc(18px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));width:320px;
  max-height:calc(100% - 370px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
.side-toggle{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:15px 18px;
  font-family:var(--display);font-stretch:110%;font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.side-toggle:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.side-toggle .chev{width:18px;height:18px;transition:transform .25s;color:var(--muted)}
.side[data-open="false"] .chev{transform:rotate(-90deg)}
.side[data-open="false"] .side-body{display:none}
.side-body{overflow:auto;padding:0 10px 14px;border-top:1px solid var(--hair);scrollbar-width:thin}
.side h3{margin:16px 8px 6px;font-family:var(--display);font-stretch:110%;font-weight:600;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.item{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;align-items:center;column-gap:10px;row-gap:6px;padding:8px 10px;border-radius:10px;transition:background .15s}
.item:hover{background:var(--glass-hi)}
.item:focus-visible{outline:2px solid var(--brass)}
.item.active{background:var(--brass-soft);box-shadow:inset 0 0 0 1px rgba(215,166,94,.45)}
.no{display:grid;place-items:center;height:22px;border-radius:999px;background:var(--c);color:#101315;font-family:var(--display);font-weight:700;font-size:11px;font-variant-numeric:tabular-nums}
.item .nm{font-weight:500;font-size:13.5px;min-width:0;line-height:1.3}
.item .nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.item .ar{font-family:var(--display);font-stretch:105%;font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.bar-track{grid-column:2/4;height:2px;background:var(--hair);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--c);border-radius:2px;opacity:.9}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 10px 0;padding-top:12px;border-top:1px solid rgba(215,166,94,.5)}
.total span{font-family:var(--display);font-stretch:110%;font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.total b{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.note{margin:14px 10px 0;font-size:11.5px;line-height:1.5;color:var(--muted)}

/* control dock */
.dock{left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:stretch;gap:4px;padding:6px;border-radius:18px;max-width:calc(100% - 36px);overflow-x:auto;scrollbar-width:none}
.tb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:68px;min-height:56px;padding:8px 10px;border-radius:12px;white-space:nowrap;
  font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--muted);transition:background .15s,color .15s}
.tb svg{width:20px;height:20px;flex:none}
.tb:hover{background:var(--glass-hi);color:var(--text)}
.tb:focus-visible{outline:2px solid var(--brass)}
.tb[aria-pressed="true"]{color:var(--text);background:var(--glass-hi)}
.tb[aria-pressed="true"] svg{color:var(--brass)}
.tb.primary{background:var(--brass);color:#16110a;font-weight:600;min-width:118px;flex-direction:row;gap:9px;font-size:13px;letter-spacing:.04em;padding-inline:16px}
.tb.primary:hover{background:#e2b571;color:#16110a}
.tb.primary[aria-pressed="true"]{background:#f0ece4;color:#16110a}
.tb.primary[aria-pressed="true"] svg{color:#16110a}
.tb .ic-stop,.tb[aria-pressed="true"] .ic-play{display:none}
.tb[aria-pressed="true"] .ic-stop{display:block}
.sep{width:1px;background:var(--hair);margin:8px 4px;flex:none}

.info{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(110px + env(safe-area-inset-bottom,0px));width:330px;max-width:calc(100% - 36px);overflow:hidden}
.info .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:18px 18px 12px}
.info h2{margin:6px 0 0;font-family:var(--display);font-stretch:112%;font-weight:700;font-size:22px;line-height:1.1;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.info .x{all:unset;cursor:pointer;width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:999px;color:var(--muted);background:var(--glass-hi)}
.info .x:hover{color:var(--text)}
.info .x:focus-visible{outline:2px solid var(--brass)}
.info .body{padding:0 18px 18px}
.info .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:12px;margin:0;padding-top:14px;border-top:1px solid var(--hair)}
.info .figs dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.info .figs dd{margin:4px 0 0;font-family:var(--display);font-stretch:110%;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.info::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--brass))}

/* light & season dial */
.envp{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:250px;padding:14px 16px 16px;display:grid;gap:12px}
.envp .row{display:flex;justify-content:space-between;align-items:baseline}
.envp label{font-family:var(--display);font-stretch:110%;font-weight:600;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.envp b{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.envp input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer}
.envp input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#3a4a6e 0%,#e7a35a 14%,#f4e3b8 30%,#fff6dc 55%,#f0b46a 82%,#2a3352 100%)}
.envp input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#3a4a6e 0%,#e7a35a 14%,#f4e3b8 30%,#fff6dc 55%,#f0b46a 82%,#2a3352 100%)}
.envp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--brass);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.envp input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--brass)}
.envp input[type=range]:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
.ends{display:flex;justify-content:space-between;margin-top:-8px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:rgba(0,0,0,.25);padding:3px;border-radius:10px;border:1px solid var(--hair)}
.seg button{all:unset;cursor:pointer;text-align:center;padding:8px 0;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--glass-hi);color:var(--text);box-shadow:inset 0 0 0 1px var(--hair)}
.seg button:focus-visible{outline:2px solid var(--brass)}

.scale{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(222px + env(safe-area-inset-bottom,0px));
  background:var(--glass);border:1px solid var(--hair);border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:10px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .5s}
.scale .rule{height:7px;border:1.5px solid var(--text);border-top:0;transition:width .15s}
.scale b{font-family:var(--display);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;min-width:40px}
.compass{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(270px + env(safe-area-inset-bottom,0px));
  width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--hair);display:grid;place-items:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .5s}
.compass svg{width:30px;height:30px;color:var(--text)}

/* cinematic caption for the presentation */
.caption{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 36px));text-align:center;pointer-events:none;
  text-shadow:0 2px 18px rgba(0,0,0,.55)}
.caption .step{font-family:var(--display);font-stretch:110%;font-weight:700;font-size:12px;letter-spacing:.24em;color:var(--brass)}
.caption b{display:block;margin-top:6px;font-family:var(--display);font-stretch:118%;font-weight:700;font-size:clamp(26px,4vw,44px);letter-spacing:.05em;text-transform:uppercase;line-height:1.02;text-wrap:balance}
.caption span{display:block;margin-top:8px;font-size:clamp(14px,1.6vw,17px);color:#e7e3da}
.caption .prog{margin:16px auto 0;width:180px;height:2px;background:rgba(255,255,255,.22);border-radius:2px;overflow:hidden}
.caption .prog i{display:block;height:100%;width:0;background:var(--brass);transition:width .6s ease}

/* presentation mode: only the model, the caption and the dock remain */
body.presenting .side,body.presenting .info,body.presenting .envp,body.presenting .scale,body.presenting .compass{opacity:0;pointer-events:none}
body.presenting .brand{opacity:.92}
body.presenting .dock{opacity:.55}
body.presenting .dock:hover{opacity:1}

.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:15px}

@media (max-width:1100px){ .tb{min-width:56px} .tb .t{font-size:10px} }
@media (max-width:900px){ .tb .t{display:none} .tb{min-height:46px;min-width:46px} .tb.primary{min-width:auto} .tb.primary .t{display:inline} }
@media (max-width:760px){
  .brand{right:max(18px,env(safe-area-inset-right,0px));padding:10px 14px 10px 10px}
  .brand h1{font-size:18px}
  .brand .tag{display:none}
  .brand .mono{width:38px;height:38px;font-size:13px}
  .side{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:max(18px,env(safe-area-inset-left,0px));width:auto;max-height:50%}
  .info{bottom:calc(140px + env(safe-area-inset-bottom,0px));width:auto;right:max(18px,env(safe-area-inset-right,0px))}
  .envp{bottom:auto;top:calc(96px + env(safe-area-inset-top,0px));right:auto;left:max(18px,env(safe-area-inset-left,0px));width:min(250px,calc(100% - 110px));padding:10px 12px 12px;gap:8px}
  .scale{bottom:auto;top:calc(96px + env(safe-area-inset-top,0px))}
  .compass{bottom:auto;top:calc(142px + env(safe-area-inset-top,0px))}
  .caption{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){ .loader,.panel,.lbl,.side-toggle .chev,.scale .rule,.caption .prog i{transition:none} .loader .bar i{animation:none;width:100%} }
</style>
</head>
<body>
<div id="app"></div>

<div class="loader" aria-hidden="true">
  <div class="in">
    <div class="mono">OP</div>
    <h2>Outlet Park Rzeszów</h2>
    <p>Przygotowywanie modelu 3D</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<header class="panel brand">
  <div class="mono" aria-hidden="true">OP</div>
  <div>
    <div class="eyebrow">Koncepcja zagospodarowania · model 3D</div>
    <h1>Outlet Park Rzeszów</h1>
    <p class="tag">Zakupy · Rozrywka · Sport · Wypoczynek · Usługi</p>
  </div>
</header>

<aside class="panel side" id="side" data-open="true">
  <button class="side-toggle" id="sideToggle" aria-expanded="true" aria-controls="sideBody">
    <span>Zestawienie powierzchni</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="side-body" id="sideBody">
    <ul class="list" id="glaList"></ul>
    <div class="total"><span>Łącznie GLA</span><b id="tGla">–</b></div>
    <h3>Rynek, usługi i parkingi</h3>
    <ul class="list" id="otherList"></ul>
    <p class="note" id="note"></p>
  </div>
</aside>

<section class="panel info" id="info" hidden aria-live="polite">
  <div class="head">
    <div><div class="eyebrow" id="infoCat"></div><h2 id="infoName"></h2></div>
    <button class="x" id="infoClose" aria-label="Zamknij"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="body">
    <dl class="figs" id="infoFigs"></dl>
  </div>
</section>

<nav class="panel dock" aria-label="Sterowanie widokiem">
  <button class="tb" id="vHome" title="Widok ogólny"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10.5l9-7 9 7V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="t">Ogólny</span></button>
  <button class="tb" id="vTop" title="Widok z góry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg><span class="t">Z góry</span></button>
  <button class="tb" id="vRoad" title="Widok od drogi S8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 21L10 3M17 21L14 3M12 7v2M12 13v2M12 19v2"/></svg><span class="t">Od S8</span></button>
  <button class="tb" id="vWalk" title="Widok na rynek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M12 3.5v5M12 15.5v5M3.5 12h5M15.5 12h5"/></svg><span class="t">Rynek</span></button>
  <span class="sep"></span>
  <button class="tb primary" id="tTour" aria-pressed="false" title="Prezentacja z przelotem kamery"><svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg><svg class="ic-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg><span class="t">Prezentacja</span></button>
  <span class="sep"></span>
  <button class="tb" id="tLabels" aria-pressed="true" title="Etykiety"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg><span class="t">Etykiety</span></button>

// ---------- life in the park: cars on the ring road and to the car park, visitors on the promenades, fountain, wind ----------
function makePath(pts, loop = false) { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, L, total: L[L.length - 1], loop }; }
function pathAt(p, s, out) {

  const a = p.pts[i - 1], b = p.pts[i], t = (s - p.L[i - 1]) / ((p.L[i] - p.L[i - 1]) || 1);
  out.x = a[0] + (b[0] - a[0]) * t; out.z = a[1] + (b[1] - a[1]) * t; out.h = Math.atan2(b[1] - a[1], b[0] - a[0]); return out;
}
function cross(p1, p2, p3, p4) { const d = (p1[0] - p2[0]) * (p3[1] - p4[1]) - (p1[1] - p2[1]) * (p3[0] - p4[0]); const t = ((p1[0] - p3[0]) * (p3[1] - p4[1]) - (p1[1] - p3[1]) * (p3[0] - p4[0])) / d; return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])]; }
function insetSite(d) {                                    // the site outline moved d metres inwards (a lane of the ring road)
  const n = SITE.length, lines = SITE.map((a, i) => { const b = SITE[(i + 1) % n], s = inward(a, b), len = Math.hypot(b[0] - a[0], b[1] - a[1]); const nx = -(b[1] - a[1]) / len * s, nz = (b[0] - a[0]) / len * s; return [[a[0] + nx * d, a[1] + nz * d], [b[0] + nx * d, b[1] + nz * d]]; });

}
const parkCars = [];

    .map(([g, m]) => { const im = new THREE.InstancedMesh(g, m, n); im.castShadow = true; im.frustumCulled = false; im.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(im); return im; });

})();
const walkers = [];
{ const lines = [];
  for (let i = 0; i < 6; i++) { const x = rr(-7, 7); lines.push(makePath([[x, -30], [x, 20]]), makePath([[x, 62], [x, 122]])); }

    dummy.position.y = .32 + 1.63 + bob; dummy.updateMatrix(); walkMesh[1].setMatrixAt(i, dummy.matrix);

// ---------- exploded floors of multi-storey buildings ----------
let exploded = null;
function explode(id) {
