<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Outlet Park Rzeszów 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: full-bleed 3D scene at 1:1 metre scale; wayfinding-style panels float over it (brand top-left, area legend right, toolbar bottom-left, info card above toolbar, scale bar bottom-right) */
:root{
  --bg:#dfe8ec;
  --panel:rgba(249,250,247,.93);
  --fg:#1d2822;
  --muted:#5a685f;
  --line:rgba(29,40,34,.13);
  --sign:#25322b;
  --sign-fg:#f2f4ef;
  --accent:#e09a26;
  --accent-soft:rgba(224,154,38,.16);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 6px 24px rgba(20,30,25,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --panel:rgba(21,28,24,.92); --fg:#e6ece7; --muted:#9caaa1; --line:rgba(230,236,231,.13);
    --sign:#0a0f0c; --sign-fg:#eef2ec; --accent:#f0b04a; --accent-soft:rgba(240,176,74,.18);
    --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:rgba(21,28,24,.92); --fg:#e6ece7; --muted:#9caaa1; --line:rgba(230,236,231,.13);
  --sign:#0a0f0c; --sign-fg:#eef2ec; --accent:#f0b04a; --accent-soft:rgba(240,176,74,.18);
  --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}

/* 3D labels */
.lbl{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;
  background:var(--sign);color:var(--sign-fg);padding:2px 7px 3px;border-radius:3px;
  font-family:var(--display);line-height:1.05;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25);
  border-bottom:2px solid var(--c,#e09a26);transform:translateY(-6px);transition:transform .15s}
.lbl b{font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.lbl b i{font-style:normal;color:var(--c,#e09a26);margin-right:5px}
.lbl span{display:none;font-family:var(--body);font-size:10px;opacity:.85;font-variant-numeric:tabular-nums}
.lbl:hover span,.lbl.active span{display:block}
.lbl:hover,.lbl.active{transform:translateY(-10px);background:var(--c,#e09a26);color:#141a16}
.lbl:hover b i,.lbl.active b i{color:#141a16}
.lbl.minor{background:rgba(37,50,43,.84);padding:2px 6px}
.lbl.minor b{font-size:9.5px}
.lbl.road{background:#c4262e;border-bottom-color:#fff;cursor:default}
.lbl.road:hover{transform:translateY(-6px);background:#c4262e;color:var(--sign-fg)}
.lbl.dim{background:#ffffff;color:#1d2822;border-bottom:0;border-left:4px solid #e09a26;cursor:default;padding:4px 10px}
.lbl.dim b{font-size:16px}
.lbl.dim span{opacity:.7}
.lbl.dim:hover{transform:translateY(-6px);background:#fff;color:#1d2822}
.hide-labels .lbl:not(.dim){display:none}
.hide-dims .lbl.dim{display:none}

/* panels */
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.brand{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));overflow:hidden;width:330px}
.brand .bar{background:var(--sign);color:var(--sign-fg);padding:12px 16px 11px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.brand .tag{margin:5px 0 0;font-family:var(--display);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:0;padding:11px 16px 13px}
.stats div{min-width:0}
.stats dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:1px 0 0;font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats dd small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}

.side{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:310px;
  max-height:calc(100% - 330px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.side-toggle{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;
  font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.side-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.side-toggle .chev{transition:transform .2s}
.side[data-open="false"] .chev{transform:rotate(-90deg)}
.side[data-open="false"] .side-body{display:none}
.side[data-open="false"] .side-toggle{border-bottom:0}
.side-body{overflow:auto;padding:6px 8px 12px}
.side h3{margin:12px 6px 4px;font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.item{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:center;column-gap:8px;row-gap:4px;
  padding:6px 8px;border-radius:4px}
.item:hover{background:var(--accent-soft)}
.item:focus-visible{outline:2px solid var(--accent)}
.item.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.no{display:grid;place-items:center;height:20px;border-radius:10px;background:var(--c);color:#141a16;font-family:var(--display);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.item .nm{font-weight:500;font-size:14px;min-width:0;line-height:1.25}
.item .nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.item .ar{font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;white-space:nowrap}
.bar-track{grid-column:2/4;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--c);border-radius:2px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:8px 8px 0;padding-top:9px;border-top:2px solid var(--fg)}
.total span{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.total b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.note{margin:12px 8px 0;font-size:12px;line-height:1.45;color:var(--muted)}

.toolbar{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:3px;padding:5px;max-width:calc(100% - 32px);overflow-x:auto}
.tb{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:4px;white-space:nowrap;
  font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase}
.tb svg{width:16px;height:16px;flex:none}
.tb:hover{background:var(--accent-soft)}
.tb:focus-visible{outline:2px solid var(--accent)}
.tb[aria-pressed="true"]{background:var(--sign);color:var(--sign-fg)}
.sep{width:1px;background:var(--line);margin:4px 2px;flex:none}

.info{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:350px;max-width:calc(100% - 32px);overflow:hidden}
.info .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 14px 10px;border-bottom:3px solid var(--c,var(--accent))}
.info h2{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.info .x{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:4px;font-size:18px;color:var(--muted)}
.info .x:hover{background:var(--accent-soft);color:var(--fg)}
.info .x:focus-visible{outline:2px solid var(--accent)}
.info .body{padding:10px 14px 14px;display:grid;gap:8px}
.info .figs{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0}
.info .figs dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.info .figs dd{margin:0;font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.info p{margin:0;font-size:14px;line-height:1.5}

.scale{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(134px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px 7px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.scale .rule{height:8px;border:2px solid var(--fg);border-top:0;transition:width .15s}
.scale b{font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums;min-width:44px}
.compass{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(182px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center}
.compass svg{width:30px;height:30px;color:var(--fg)}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:15px}

@media (max-width:1400px){ .tb .t{display:none} .tb{padding:9px} }
.envp{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:240px;padding:10px 12px 12px;display:grid;gap:8px}
.envp .row{display:flex;justify-content:space-between;align-items:baseline}
.envp label{font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.envp b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.envp input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--line);padding:3px;border-radius:5px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:6px 0;border-radius:3px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.seg button:hover{background:var(--accent-soft)}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--sign-fg)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.caption{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100% - 32px));text-align:center;pointer-events:none;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.caption .step{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.24em;color:#f0b04a}
.caption b{display:block;margin-top:4px;font-family:var(--display);font-weight:700;font-size:clamp(28px,4.2vw,48px);letter-spacing:.04em;text-transform:uppercase;line-height:1}
.caption span{display:block;margin-top:8px;font-size:clamp(14px,1.6vw,17px)}
.caption .prog{margin:14px auto 0;width:180px;height:2px;background:rgba(255,255,255,.3);overflow:hidden}
.caption .prog i{display:block;height:100%;width:0;background:#f0b04a;transition:width .6s ease}
body.presenting .side,body.presenting .info,body.presenting .envp,body.presenting .scale,body.presenting .compass{opacity:0;pointer-events:none}
body.presenting .toolbar{opacity:.55}
body.presenting .toolbar:hover{opacity:1}
.side,.info,.envp,.scale,.compass,.toolbar{transition:opacity .5s}
@media (max-width:760px){
  .brand{width:auto;right:max(16px,env(safe-area-inset-right,0px))}
  .brand h1{font-size:22px}
  .brand .tag{display:none}
  .brand .bar{padding:9px 12px}
  .stats{grid-template-columns:repeat(4,auto);padding:7px 12px 9px;gap:2px 12px}
  .stats dd{font-size:15px}
  .stats dd small{display:none}
  .side{top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));width:auto;max-height:52%}
  .info{bottom:calc(122px + env(safe-area-inset-bottom,0px));width:auto;right:max(16px,env(safe-area-inset-right,0px))}
  .scale{bottom:auto;top:calc(150px + env(safe-area-inset-top,0px))}
  .compass{bottom:auto;top:calc(196px + env(safe-area-inset-top,0px))}
  .envp{bottom:auto;top:calc(150px + env(safe-area-inset-top,0px));right:auto;left:max(16px,env(safe-area-inset-left,0px));width:min(240px,calc(100% - 110px))}
  .caption b{font-size:20px}
}
@media (max-width:420px){ .stats{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion: reduce){ .lbl,.side-toggle .chev,.scale .rule{transition:none} }
</style>
</head>
<body>
<div id="app"></div>

<header class="panel brand">
  <div class="bar">
    <div class="eyebrow">Model 3D · skala 1:1 · wg szkicu</div>
    <h1>Outlet Park Rzeszów</h1>
    <p class="tag">Zakupy · Rozrywka · Sport · Wypoczynek · Usługi</p>
  </div>
</header>

<aside class="panel side" id="side" data-open="true">
  <button class="side-toggle" id="sideToggle" aria-expanded="true" aria-controls="sideBody">
    <span>Zestawienie powierzchni</span><span class="chev" aria-hidden="true">▾</span>
  </button>
  <div class="side-body" id="sideBody">
    <ul class="list" id="glaList"></ul>
    <div class="total"><span>Łącznie (GLA)</span><b id="tGla">–</b></div>
    <h3>Rynek, usługi i parkingi</h3>
    <ul class="list" id="otherList"></ul>
    <p class="note" id="note"></p>
  </div>
</aside>

<section class="panel info" id="info" hidden aria-live="polite">
  <div class="head">
    <div><div class="eyebrow" id="infoCat"></div><h2 id="infoName"></h2></div>
    <button class="x" id="infoClose" aria-label="Zamknij">✕</button>
  </div>
  <div class="body">
    <dl class="figs" id="infoFigs"></dl>
  </div>
</section>

<nav class="panel toolbar" aria-label="Sterowanie widokiem">
  <button class="tb" id="vHome" title="Widok ogólny"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="t">Ogólny</span></button>
  <button class="tb" id="vTop" title="Widok z góry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h16M12 4v16"/></svg><span class="t">Z góry</span></button>
  <button class="tb" id="vRoad" title="Widok od drogi S8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21L10 3M17 21L14 3M12 7v2M12 13v2M12 19v2"/></svg><span class="t">Od S8</span></button>
  <button class="tb" id="vWalk" title="Widok na rynek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M12 3.5v5M12 15.5v5M3.5 12h5M15.5 12h5"/></svg><span class="t">Rynek</span></button>
  <button class="tb" id="tTour" aria-pressed="false" title="Wycieczka kamerą"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 5l12 7-12 7z"/></svg><span class="t">Prezentacja</span></button>
  <span class="sep"></span>
  <button class="tb" id="tGrid" aria-pressed="false" title="Siatka co 50 m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18"/></svg><span class="t">Siatka 50 m</span></button>
  <button class="tb" id="tLabels" aria-pressed="true" title="Etykiety"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg><span class="t">Etykiety</span></button>
  <button class="tb" id="tNight" aria-pressed="false" title="Noc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span class="t">Noc</span></button>
  <button class="tb" id="tRotate" aria-pressed="false" title="Obrót automatyczny"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span class="t">Obrót</span></button>
  <button class="tb" id="tTraffic" aria-pressed="true" title="Ruch w parku i na S8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM7 19v2M17 19v2"/></svg><span class="t">Ruch</span></button>
</nav>

<div class="compass" aria-hidden="true"><svg viewBox="0 0 30 30" id="needle"><path d="M15 3l5 12h-10z" fill="#c4262e"/><path d="M15 27l5-12h-10z" fill="currentColor" opacity=".35"/><text x="15" y="12.5" font-size="6" text-anchor="middle" fill="#fff" font-family="Barlow Condensed,Arial" font-weight="700">N</text></svg></div>
<div class="scale" aria-label="Podziałka"><span class="rule" id="rule"></span><b id="ruleTxt">100 m</b></div>
<section class="panel envp" aria-label="Pora dnia i pora roku">
  <div class="row"><label for="tod">Pora dnia</label><b id="todTxt">16:00</b></div>
  <input type="range" id="tod" min="5" max="22" step="0.05" value="16">
  <div class="seg" role="group" aria-label="Pora roku">
    <button data-s="summer" aria-pressed="true">Lato</button><button data-s="autumn" aria-pressed="false">Jesień</button><button data-s="winter" aria-pressed="false">Zima</button>
  </div>
</section>
<div class="caption" id="caption" hidden><div class="step" id="capStep"></div><b id="capT"></b><span id="capS"></span><div class="prog"><i id="capBar"></i></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = s => document.querySelector(s);
const app = $('#app');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const V3 = THREE.Vector3;

// ---------- programme (numbers as on the hand sketch) ----------
const GLA = [
  { id:'b5', no:'5', name:'Fly Park + restauracja', area:10000, levels:1, cat:'Rozrywka', color:'#3b7bd6',
    desc:'Park trampolin z restauracją w północnym pasie, obok zielonego parku i placu zabaw.' },
  { id:'b8', no:'8', name:'Dom i Ogród', area:10000, levels:1, cat:'Handel wielkopowierzchniowy', color:'#5f9a48',
    desc:'Market budowlano-ogrodniczy we wschodniej części, z ogrodem sezonowym od strony parkingu.' },
  { id:'b9', no:'9', name:'Sklepy', sub:'Agata Meble, Zara itp.', area:9350, levels:2, cat:'Handel · 2 × 4 675 m²', color:'#e0892f',

const AUTUMN = ['#c8752a', '#d99a2b', '#b5462a', '#e0b43a', '#9a5a26', '#7f8c3a'].map(C);

    if (m.userData.c0) m.userData.c0.copy(m.color);

}
function setSeason(sz) {

  recolour(texMats.get(TX.field), w ? SNOW : PLOUGH, w ? .9 : a ? .6 : 0);
  recolour(texMats.get(TX.roof), SNOW, w ? .85 : 0);
  recolour(texMats.get(TX.slab), SNOW, w ? .35 : 0);

      if (!conifer && w) c.copy(BARE);

    shrubSet.im.instanceColor.needsUpdate = true;

  setTime(timeH);
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setSeason(b.dataset.s)));
setTime(16);

// ---------- life in the park: cars on the ring road and to the car park, visitors on the promenades, fountain, wind ----------
function makePath(pts, loop = false) { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, L, total: L[L.length - 1], loop }; }
function pathAt(p, s, out) {
  let i = 1; while (i < p.L.length - 1 && p.L[i] < s) i++;
  const a = p.pts[i - 1], b = p.pts[i], t = (s - p.L[i - 1]) / ((p.L[i] - p.L[i - 1]) || 1);
  out.x = a[0] + (b[0] - a[0]) * t; out.z = a[1] + (b[1] - a[1]) * t; out.h = Math.atan2(b[1] - a[1], b[0] - a[0]); return out;
}
function cross(p1, p2, p3, p4) { const d = (p1[0] - p2[0]) * (p3[1] - p4[1]) - (p1[1] - p2[1]) * (p3[0] - p4[0]); const t = ((p1[0] - p3[0]) * (p3[1] - p4[1]) - (p1[1] - p3[1]) * (p3[0] - p4[0])) / d; return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])]; }
function insetSite(d) {                                    // the site outline moved d metres inwards (a lane of the ring road)
  const n = SITE.length, lines = SITE.map((a, i) => { const b = SITE[(i + 1) % n], s = inward(a, b), len = Math.hypot(b[0] - a[0], b[1] - a[1]); const nx = -(b[1] - a[1]) / len * s, nz = (b[0] - a[0]) / len * s; return [[a[0] + nx * d, a[1] + nz * d], [b[0] + nx * d, b[1] + nz * d]]; });
  return lines.map((l, i) => { const m = lines[(i + n - 1) % n]; return cross(m[0], m[1], l[0], l[1]); });
}
const parkCars = [];
{ const outer = insetSite(2.4), inner = insetSite(6.4).reverse();
  const lanes = [makePath([...outer, outer[0]], true), makePath([...inner, inner[0]], true)];
  lanes.forEach(p => { for (let i = 0; i < 14; i++) parkCars.push({ p, s: p.total * i / 14 + rr(0, 20), v: rr(7, 10) }); });
  const arrive = makePath([[400, 229.3], [-190, 229.3], [-206.5, 222], [-206.5, 197.4], [22, 197.4], [22, 106], [-150, 106]]);
  const leave = makePath([[150, 110], [28, 110], [28, 222], [41, 243.2], [450, 243.2]]);
  [arrive, leave].forEach(p => { for (let i = 0; i < 4; i++) parkCars.push({ p, s: -i * 22, v: rr(8, 11) }); });
}
const fleet = (() => {
  const paint = M('#ffffff', { roughness: .25, metalness: .5 }), n = parkCars.length;
  const parts = [[new THREE.BoxGeometry(4.3, .72, 1.85).translate(0, .62, 0), paint], [cabinGeo(1.62, .6, 2.9, 'x').translate(-.15, 1.27, 0), M('#1f2a33', { roughness: .08, metalness: .8 })],
    [new THREE.BoxGeometry(.06, .13, 1.5).translate(2.17, .82, 0), lightMat], [new THREE.BoxGeometry(.06, .13, 1.5).translate(-2.17, .84, 0), tailMat]]
    .map(([g, m]) => { const im = new THREE.InstancedMesh(g, m, n); im.castShadow = true; im.frustumCulled = false; im.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(im); return im; });
  const c = new THREE.Color(); parkCars.forEach((v, i) => parts[0].setColorAt(i, c.set(pickOf(CAR_COLS))));
  return parts;
})();
const walkers = [];
{ const lines = [];
  for (let i = 0; i < 6; i++) { const x = 25 + rr(-5, 5); lines.push(makePath([[x, -22], [x, 20]]), makePath([[x, 62], [x, 102]])); }
  const ring = []; for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2; ring.push([25 + Math.cos(a) * 10.2, 41 + Math.sin(a) * 10.2]); }
  lines.push(makePath(ring, true));
  [-16.5, 97.5].forEach(z => lines.push(makePath([[-103, z], [153, z]])));
  [23, 31, 51, 59].forEach(z => lines.push(makePath([[-102, z], [2, z]])));
  [23, 31, 51, 59].forEach(z => lines.push(makePath([[48, z], [152, z]])));
  [[17, 112, 189], [33, 112, 189]].forEach(([x, a, b]) => lines.push(makePath([[x, a], [x, b]])));
  for (let i = 0; i < 180; i++) { const p = pickOf(lines); walkers.push({ p, s: rr(0, p.total), dir: rnd() < .5 ? 1 : -1, v: rr(1.05, 1.5), off: rr(-1.2, 1.2), ph: rr(0, 6) }); }
}
const walkMesh = (() => {
  const body = new THREE.InstancedMesh(new THREE.CapsuleGeometry(.2, .95, 2, 8), M('#ffffff', { roughness: .9 }), walkers.length);
  const head = new THREE.InstancedMesh(new THREE.SphereGeometry(.12, 10, 8), M('#d9b49a', { roughness: .8 }), walkers.length);
  const c = new THREE.Color(), cols = ['#2c3e66', '#8e1f22', '#e8e2d4', '#3a4a3a', '#c99a3a', '#555b62', '#9fb0c8', '#704a3a', '#1f2328'];
  walkers.forEach((w, i) => body.setColorAt(i, c.set(pickOf(cols))));
  [body, head].forEach(m => { m.castShadow = true; m.frustumCulled = false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m); });
  return [body, head];
})();
const tmpP = {}, dummy = new THREE.Object3D();
function parkMotion(dt, now) {
  windTime.value += dt;
  jets.forEach(([j, hgt, ph]) => { const k = .65 + .35 * (.5 + .5 * Math.sin(now * .0035 + ph)); j.scale.y = k; j.position.y = .65 + hgt * k / 2; });
  parkCars.forEach((c, i) => {
    c.s += c.v * dt;
    if (c.p.loop) c.s %= c.p.total;
    else if (c.s > c.p.total) c.s = -rr(10, 60);
    if (c.s < 0) dummy.position.set(0, -50, 0);
    else { pathAt(c.p, c.s, tmpP); dummy.position.set(tmpP.x, .1, tmpP.z); dummy.rotation.set(0, -tmpP.h, 0); }
    dummy.updateMatrix(); fleet.forEach(m => m.setMatrixAt(i, dummy.matrix));
  });
  fleet.forEach(m => { m.instanceMatrix.needsUpdate = true; });
  dummy.rotation.set(0, 0, 0);
  walkers.forEach((w, i) => {
    w.s += w.dir * w.v * dt;
    if (w.p.loop) w.s = (w.s + w.p.total) % w.p.total;
    else if (w.s < 0 || w.s > w.p.total) { w.dir *= -1; w.s = THREE.MathUtils.clamp(w.s, 0, w.p.total); }
    pathAt(w.p, w.s, tmpP);
    const ox = -Math.sin(tmpP.h) * w.off, oz = Math.cos(tmpP.h) * w.off, bob = Math.abs(Math.sin(now * .009 * w.v + w.ph)) * .05;
    dummy.position.set(tmpP.x + ox, .32 + .675 + bob, tmpP.z + oz); dummy.updateMatrix(); walkMesh[0].setMatrixAt(i, dummy.matrix);
    dummy.position.y = .32 + 1.47 + bob; dummy.updateMatrix(); walkMesh[1].setMatrixAt(i, dummy.matrix);
  });
  walkMesh.forEach(m => { m.instanceMatrix.needsUpdate = true; });
}
parkMotion(0, 0);

// ---------- camera tour ----------
const TOUR = [
  [new V3(-60, 260, 520), new V3(5, 0, 20), 'Outlet Park Rzeszów', 'Park handlowo-usługowy przy drodze ekspresowej S8'],
  [new V3(-60, 34, 310), new V3(-100, 4, 205), 'Dwa wjazdy z S8', 'Na środku frontu i za hotelem'],
  [new V3(-60, 26, 248), new V3(-60, 6, 176), 'Pas usługowy przy drodze', 'Hotel, McDonald’s, stacja paliw, KFC i myjnia'],
  [new V3(-112, 36, 228), new V3(-160, 15, 177), 'Hotel', '8 kondygnacji, taras na dachu'],
  [new V3(25, 3.2, 101), new V3(25, 4, 41), 'Deptak do rynku', 'Główna oś piesza przez środek parku'],
  [new V3(57, 17, 72), new V3(25, 3, 41), 'Rynek', 'Fontanna, zadaszenie, ławki i zieleń'],
  [new V3(160, 7, 51), new V3(70, 5, 51), 'Pierzeje sklepów', 'Dwupoziomowe sklepy i pasaże z restauracjami'],
  [new V3(150, 62, 160), new V3(213, 5, 62), 'Dom i Ogród, Lidl', 'Duzi najemcy we wschodniej części'],
  [new V3(10, 70, -8), new V3(20, 5, -105), 'Fly Park, Gym & Padel', 'Rozrywka, sport i plac zabaw w północnym pasie'],
  [VIEWS.home[0], VIEWS.home[1], 'Outlet Park Rzeszów', `${fmt(TOTAL)} m² GLA · ${fmt(Math.round(stalls / 10) * 10)} miejsc parkingowych`],
];
let tour = null;
function startTour() {
  select(null); controls.autoRotate = false; press($('#tRotate'), false);
  tour = { i: -1, next: 0 }; press($('#tTour'), true); $('#caption').hidden = false;
  document.body.classList.add('presenting'); labelRenderer.domElement.classList.add('hide-labels');
  $('#tTour').querySelector('.t').textContent = 'Zakończ';
}
function stopTour() {
  if (!tour) return; tour = null; press($('#tTour'), false); $('#caption').hidden = true;
  document.body.classList.remove('presenting');
  labelRenderer.domElement.classList.toggle('hide-labels', $('#tLabels').getAttribute('aria-pressed') !== 'true');
  $('#tTour').querySelector('.t').textContent = 'Prezentacja';
}
function stepTour(now) {
  if (!tour || now < tour.next) return;
  tour.i++;
  if (tour.i >= TOUR.length) { stopTour(); return; }
  const [p, t, title, sub] = TOUR[tour.i], dur = reduce ? 0 : 4200;
  flyTo(p, t, dur); $('#capT').textContent = title; $('#capS').textContent = sub;
  $('#capStep').textContent = `${String(tour.i + 1).padStart(2, '0')} / ${String(TOUR.length).padStart(2, '0')}`;
  $('#capBar').style.width = ((tour.i + 1) / TOUR.length * 100) + '%';
  tour.next = now + dur + 2600;
}
$('#tTour').addEventListener('click', () => tour ? stopTour() : startTour());

// ---------- exploded floors of multi-storey buildings ----------
let exploded = null;
function explode(id) {
  const d = ALL[id], ex = new THREE.Group(), parts = [], els = [];
  const mat = M(d.color, { transparent: true, opacity: .93, roughness: .45 }), edgeMat = new THREE.LineBasicMaterial({ color: '#ffffff' });
  footprints[id].forEach((f, fi, all) => {
    const lh = f.h / f.levels;
    for (let i = 0; i < f.levels; i++) {
      const geo = new THREE.BoxGeometry(f.x2 - f.x1, lh - .6, f.z2 - f.z1), m = new THREE.Mesh(geo, mat);
      m.castShadow = true; m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
      m.position.set((f.x1 + f.x2) / 2, i * lh + lh / 2, (f.z1 + f.z2) / 2); ex.add(m); parts.push([m, i, lh]);
      if (fi === 0) {
        const el = document.createElement('div'); el.className = 'lbl minor'; el.style.setProperty('--c', d.color); el.style.pointerEvents = 'none';
        el.innerHTML = '<b></b><span></span>'; el.querySelector('b').textContent = i ? `Piętro ${i}` : 'Parter';
        el.querySelector('span').textContent = fmt(d.area / all.length / f.levels) + ' m²' + (all.length > 1 ? ' w budynku' : '');
        const o = new CSS2DObject(el); o.position.set((f.x2 - f.x1) / 2 + 3, 0, (f.z2 - f.z1) / 2); m.add(o); els.push(el);
      }
    }
  });
  ex.position.copy(groups[id].position); ex.rotation.copy(groups[id].rotation);   // turned groups (offices) explode in place
  groups[id].visible = false; scene.add(ex);
  exploded = { id, ex, parts, els, start: performance.now() };
}
function clearExplode() {
  if (!exploded) return;
  scene.remove(exploded.ex); groups[exploded.id].visible = true;
  exploded.els.forEach(el => el.remove());
  exploded.ex.traverse(o => { o.geometry?.dispose(); });
  exploded = null;
}
function stepExplode(now) {
  if (!exploded) return;
  const k = reduce ? 1 : Math.min(1, (now - exploded.start) / 900), e = 1 - Math.pow(1 - k, 3);
  exploded.parts.forEach(([m, i, lh]) => { m.position.y = i * lh + lh / 2 + i * 6 * e; });
}

// ---------- loop ----------
addEventListener('resize', () => {
  const w = app.clientWidth, h = app.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); labelRenderer.setSize(w, h); composer.setSize(w, h);
});
const needle = $('#needle'), rule = $('#rule'), ruleTxt = $('#ruleTxt');
const NICE = [5, 10, 20, 50, 100, 200, 500];
function updateScale() {
  const dist = camera.position.distanceTo(controls.target);
  const mpp = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / app.clientHeight;
  const m = NICE.find(n => n / mpp >= 70) || 500;
  rule.style.width = Math.round(m / mpp) + 'px';
  ruleTxt.textContent = m + ' m';
}
const clock = new THREE.Clock();
function frame(now) {
  const dt = Math.min(clock.getDelta(), .1);
  if (fly) {
    const k = fly.dur ? Math.min(1, (now - fly.start) / fly.dur) : 1;
    const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (k >= 1) fly = null;
  }
  if (moving) { traffic(dt); parkMotion(dt, now); }
  stepTour(now); stepExplode(now); infraMotion(now, moving);
  if (envDirty && now - envAt > 120) refreshEnv();
  if (moveQueued) { setHover(pick(moveQueued)); moveQueued = null; }
  controls.update();
  needle.style.transform = `rotate(${controls.getAzimuthalAngle()}rad)`;
  updateScale();
  const near = THREE.MathUtils.clamp(camera.position.distanceTo(controls.target) * .004, .3, 4);   // keeps depth precise without a log depth buffer
  if (Math.abs(near - camera.near) > .05) { camera.near = near; camera.updateProjectionMatrix(); }
  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
